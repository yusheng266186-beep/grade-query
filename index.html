<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#173c4b">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>高二4班 · 零诊成绩报告</title>
  <style>
    :root {
      --ink: #172733;
      --muted: #718087;
      --paper: #f4f2ec;
      --surface: rgba(255, 255, 255, .88);
      --surface-solid: #fffefa;
      --line: rgba(27, 55, 66, .11);
      --navy: #173c4b;
      --navy-2: #245768;
      --jade: #2f7168;
      --jade-soft: #e8f2ee;
      --gold: #bd8b48;
      --gold-soft: #f7eddd;
      --rose: #ad6261;
      --rose-soft: #f7eae8;
      --shadow: 0 22px 60px rgba(25, 48, 57, .10);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    .query-view {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 32px 18px;
      color: #f7f4ea;
      background:
        radial-gradient(circle at 12% 18%, rgba(211, 176, 114, .16), transparent 28%),
        radial-gradient(circle at 86% 80%, rgba(95, 163, 151, .19), transparent 31%),
        linear-gradient(145deg, #102f3c 0%, #173f4d 48%, #205c5b 100%);
    }
    .query-view::before,
    .query-view::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 50%;
    }
    .query-view::before { left: -240px; top: -180px; }
    .query-view::after { right: -250px; bottom: -220px; }

    .query-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 480px);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      color: rgba(255,255,255,.76);
      font-size: 12px;
      letter-spacing: .28em;
    }
    .brand-seal {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.15);
      color: #f5dcae;
      font-weight: 700;
      letter-spacing: 0;
    }
    .query-heading { text-align: center; margin-bottom: 28px; }
    .query-kicker {
      margin: 0 0 11px;
      color: #e3c48c;
      font-size: 12px;
      letter-spacing: .35em;
    }
    .query-heading h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 660;
      letter-spacing: .06em;
      line-height: 1.18;
    }
    .query-heading p {
      margin: 13px 0 0;
      color: rgba(244,247,244,.62);
      font-size: 14px;
      letter-spacing: .06em;
    }
    .query-card {
      padding: 28px;
      border-radius: 28px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.50);
      box-shadow: 0 32px 90px rgba(4, 23, 31, .28);
      color: var(--ink);
      backdrop-filter: blur(18px);
    }
    .field + .field { margin-top: 18px; }
    .field label {
      display: flex;
      justify-content: space-between;
      margin: 0 0 8px;
      color: #52646c;
      font-size: 13px;
      font-weight: 650;
    }
    .field label span { color: #9aa5a7; font-weight: 400; font-size: 11px; }
    .field input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #dde4e2;
      border-radius: 15px;
      outline: none;
      color: var(--ink);
      background: #f8faf8;
      transition: .2s ease;
    }
    .field input:focus {
      border-color: #5c928a;
      background: white;
      box-shadow: 0 0 0 4px rgba(47, 113, 104, .10);
    }
    .field input::placeholder { color: #afb7b7; }
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 48px; }
    .field-clear { position: absolute; top: 50%; right: 11px; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; color: #7d8a8c; background: #e9efed; font-size: 18px; line-height: 1; transform: translateY(-50%); cursor: pointer; }
    .field-clear:hover { color: var(--navy); background: #dce9e5; }
    .primary-btn {
      width: 100%;
      height: 54px;
      margin-top: 22px;
      border: 0;
      border-radius: 15px;
      color: white;
      background: linear-gradient(135deg, #173c4b, #2e6e68);
      box-shadow: 0 14px 30px rgba(28, 79, 82, .22);
      font-weight: 650;
      letter-spacing: .16em;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 18px 34px rgba(28, 79, 82, .28); }
    .primary-btn:active { transform: translateY(0); }
    .primary-btn:disabled { opacity: .72; cursor: wait; transform: none; }
    .primary-btn[aria-busy="true"]::after { content: ""; width: 13px; height: 13px; margin-left: 8px; border: 2px solid rgba(255,255,255,.42); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #a55353;
      text-align: center;
      font-size: 12px;
    }
    .query-helper { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; color: #9aa5a7; font-size: 10px; line-height: 1.5; }
    .query-note {
      margin: 18px 0 0;
      color: rgba(255,255,255,.48);
      text-align: center;
      font-size: 11px;
      letter-spacing: .10em;
    }

    .report-view { min-height: 100vh; padding: 22px 18px 56px; }
    .report-shell { width: min(100%, 1120px); margin: 0 auto; }
    .report-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      margin-bottom: 18px;
    }
    .report-brand { display: flex; align-items: center; gap: 10px; color: var(--navy); font-weight: 700; }
    .report-brand .brand-seal { color: white; background: var(--navy); border: 0; }
    .ghost-btn {
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      color: #4d6068;
      cursor: pointer;
    }
    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(260px, 1.05fr) minmax(360px, 1.35fr);
      gap: 28px;
      padding: clamp(26px, 4.5vw, 48px);
      border-radius: var(--radius-xl);
      color: white;
      background:
        radial-gradient(circle at 92% 8%, rgba(222, 190, 130, .18), transparent 34%),
        linear-gradient(135deg, #153946 0%, #1e5260 60%, #2d6b63 100%);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      right: -220px;
      bottom: -250px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.16);
    }
    .student-meta { position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 12px; color: rgba(255,255,255,.60); font-size: 11px; letter-spacing: .24em; }
    .student-name { margin: 0; font-size: clamp(30px, 5vw, 44px); font-weight: 680; letter-spacing: .08em; }
    .class-tag {
      display: inline-flex;
      margin-top: 12px;
      padding: 6px 11px;
      border-radius: 999px;
      color: #e9d6ad;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 11px;
    }
    .score-line { display: flex; align-items: flex-end; gap: 12px; margin-top: 30px; }
    .score-number { font-size: clamp(58px, 10vw, 88px); font-weight: 740; letter-spacing: -.05em; line-height: .86; }
    .score-unit { padding-bottom: 8px; color: rgba(255,255,255,.58); font-size: 13px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.14);
      font-size: 13px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #8fd0b4; box-shadow: 0 0 0 5px rgba(143,208,180,.11); }
    .hero-data { position: relative; z-index: 1; display: grid; align-content: center; gap: 12px; }
    .rank-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .rank-card, .cutoff-card {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
    }
    .rank-card span, .cutoff-card span { display: block; color: rgba(255,255,255,.55); font-size: 10px; letter-spacing: .10em; }
    .rank-card strong { display: block; margin-top: 7px; font-size: clamp(20px, 3vw, 30px); font-weight: 680; }
    .rank-card small { color: rgba(255,255,255,.46); font-size: 10px; }
    .cutoff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cutoff-card strong { display: block; margin-top: 7px; font-size: 20px; }
    .cutoff-card small { display: block; margin-top: 4px; color: rgba(255,255,255,.48); font-size: 10px; }

    .section-grid { display: grid; grid-template-columns: 1.12fr .88fr; gap: 18px; margin-top: 18px; }
    .panel {
      padding: clamp(20px, 3vw, 28px);
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: 0 12px 40px rgba(25, 48, 57, .055);
      backdrop-filter: blur(10px);
    }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .panel-title { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .04em; }
    .panel-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .tiny-legend { color: #899496; font-size: 10px; white-space: nowrap; }

    .subjects { display: grid; gap: 10px; }
    .subject-row {
      padding: 16px;
      border-radius: 17px;
      background: #fbfbf8;
      border: 1px solid #edf0ec;
    }
    .subject-top { display: grid; grid-template-columns: 52px 64px 1fr auto; align-items: center; gap: 12px; }
    .subject-name { color: #41545c; font-size: 13px; font-weight: 700; }
    .subject-score { font-size: 25px; font-weight: 750; letter-spacing: -.03em; }
    .subject-score small { margin-left: 2px; color: #9aa4a4; font-size: 10px; font-weight: 400; }
    .subject-rank { color: #738186; font-size: 11px; }
    .state-pill { padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .state-control { color: #245f50; background: var(--jade-soft); }
    .state-bachelor { color: #745622; background: var(--gold-soft); }
    .state-close { color: #875858; background: var(--rose-soft); }
    .state-below { color: #7a6d69; background: #eeeae6; }
    .meter { position: relative; height: 7px; margin: 14px 0 8px; border-radius: 999px; background: #e9ece8; overflow: visible; }
    .meter-fill { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9ebcb5, #36756c); }
    .meter-mark { position: absolute; top: -3px; width: 2px; height: 13px; border-radius: 2px; }
    .meter-mark.bachelor { background: #cda25d; }
    .meter-mark.control { background: #235d54; }
    .subject-foot { display: flex; justify-content: space-between; gap: 10px; color: #879294; font-size: 10px; }
    .subject-diffs { display: flex; gap: 10px; flex-wrap: wrap; }
    .diff-positive { color: #2f7168; }
    .diff-negative { color: #9a6762; }

    .insights { display: grid; gap: 12px; }
    .insight {
      position: relative;
      padding: 18px 18px 18px 50px;
      border-radius: 18px;
      background: #fbfbf8;
      border: 1px solid #edf0ec;
    }
    .insight-index {
      position: absolute;
      left: 17px;
      top: 17px;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: white;
      background: var(--navy-2);
      font-size: 10px;
    }
    .insight h4 { margin: 0; color: #30464f; font-size: 13px; }
    .insight p { margin: 6px 0 0; color: #738084; font-size: 12px; line-height: 1.65; }

    .trend-panel { margin-top: 18px; }
    .trend-tabs { display: flex; gap: 7px; flex-wrap: wrap; }
    .trend-tab {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid #e2e8e5;
      border-radius: 999px;
      color: #66777d;
      background: #fafbf9;
      font-size: 11px;
      cursor: pointer;
    }
    .trend-tab.active { color: white; background: var(--navy); border-color: var(--navy); }
    .chart-wrap { position: relative; height: 260px; margin-top: 18px; }
    .chart-wrap canvas { display: block; width: 100%; height: 100%; }
    .chart-wrap canvas:focus-visible { outline: 3px solid rgba(47,113,104,.22); outline-offset: -3px; border-radius: 12px; }
    .chart-tooltip { position: absolute; z-index: 2; display: grid; gap: 3px; min-width: 112px; padding: 9px 11px; border: 1px solid rgba(255,255,255,.78); border-radius: 11px; color: #fff; background: rgba(23,60,75,.94); box-shadow: 0 10px 25px rgba(23,60,75,.18); pointer-events: none; font-size: 10px; }
    .chart-tooltip b { color: #e3c48c; font-size: 10px; }
    .chart-tooltip span { color: rgba(255,255,255,.78); }
    .chart-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: #879294;
      background: #f8f9f6;
      font-size: 12px;
    }
    .exam-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
    .exam-card { padding: 10px 8px; border-radius: 13px; background: #f8f9f6; text-align: center; }
    .exam-card strong { display: block; color: #334952; font-size: 12px; }
    .exam-card span { display: block; margin-top: 4px; color: #8b9697; font-size: 9px; line-height: 1.35; }

    .rank-timeline { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; margin-top: 16px; }
    .rank-stop { min-height: 116px; padding: 13px; border-radius: 16px; background: #fafaf7; border: 1px solid #edf0ec; }
    .scope-tag { display: inline-flex; padding: 4px 7px; border-radius: 999px; font-size: 9px; }
    .scope-city { color: #2b5d70; background: #e7f0f3; }
    .scope-school { color: #4e685f; background: #e9f0ec; }
    .rank-stop strong { display: block; margin-top: 13px; font-size: 19px; }
    .rank-stop p { margin: 5px 0 0; color: #849092; font-size: 10px; line-height: 1.45; }
    .zero-ranks { margin-top: 8px; color: #587079; font-size: 9px; line-height: 1.6; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    details.panel { padding: 0; overflow: hidden; }
    details.panel summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 24px;
      cursor: pointer;
    }
    details.panel summary::-webkit-details-marker { display: none; }
    .summary-sign { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #edf2ef; color: #526b63; transition: transform .2s ease; }
    details[open] .summary-sign { transform: rotate(45deg); }
    .detail-body { padding: 0 24px 24px; }
    .knowledge-list { display: grid; gap: 10px; }
    .knowledge-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 13px; border-radius: 14px; background: #fafaf7; }
    .knowledge-item b { font-size: 12px; }
    .knowledge-item span { color: #68787d; font-size: 11px; }
    .knowledge-item small { color: #9b6a62; font-size: 10px; }

    .class-context { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .context-stat { padding: 16px; border-radius: 16px; background: #fafaf7; text-align: center; }
    .context-stat strong { display: block; font-size: 22px; }
    .context-stat span { display: block; margin-top: 5px; color: #849092; font-size: 10px; }
    .source-note { margin: 18px 0 0; color: #929b9a; text-align: center; font-size: 10px; line-height: 1.7; }
    .report-actions { display: flex; justify-content: center; gap: 9px; margin: 17px 0 0; }
    .report-actions .ghost-btn { min-width: 108px; min-height: 38px; font-size: 11px; }
    .report-action-main { color: #fff; border-color: var(--navy); background: var(--navy); }

    .fade-in { animation: fadeIn .45s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 860px) {
      .hero, .section-grid, .detail-grid { grid-template-columns: 1fr; }
      .rank-timeline { grid-template-columns: repeat(3, 1fr); }
      .exam-strip { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 560px) {
      .report-view { padding: 12px 10px 38px; }
      .report-nav { padding: 0 6px; }
      .hero { padding: 26px 20px; border-radius: 24px; }
      .score-number { font-size: 68px; }
      .rank-grid { grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
      .rank-card { padding: 13px 9px; }
      .rank-card strong { font-size: 20px; }
      .cutoff-card { padding: 14px; }
      .panel { padding: 20px 16px; }
      .subject-top { grid-template-columns: 43px 58px 1fr; gap: 8px; }
      .subject-rank { text-align: right; }
      .state-pill { grid-column: 1 / -1; justify-self: start; }
      .rank-timeline { grid-template-columns: 1fr 1fr; }
      .class-context { grid-template-columns: 1fr 1fr; }
      .panel-head { flex-direction: column; gap: 8px; }
      .chart-wrap { height: 230px; }
      .query-card { padding: 24px 20px; }
      .query-helper { flex-direction: column; gap: 3px; text-align: center; }
      .report-actions { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5; margin: 17px -8px 0; padding: 8px; border: 1px solid rgba(255,255,255,.72); border-radius: 16px; background: rgba(244,242,236,.86); box-shadow: 0 12px 30px rgba(25,48,57,.10); backdrop-filter: blur(12px); }
      .report-actions .ghost-btn { flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <section class="query-view" id="queryView">
      <div class="query-shell fade-in">
        <div class="brand-mark"><span class="brand-seal">荣</span><span>荣县一中 · 高2024级</span></div>
        <header class="query-heading">
          <p class="query-kicker">阶段成长记录</p>
          <h1>零诊成绩报告</h1>
          <p>看清当下，也看见这一路的变化</p>
        </header>
        <form class="query-card" id="queryForm" novalidate aria-describedby="queryHint">
          <div class="field">
            <label for="nameInput">学生姓名 <span>必填</span></label>
            <div class="input-wrap"><input id="nameInput" name="name" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="20" placeholder="请输入学生姓名"><button class="field-clear" type="button" data-clear="nameInput" aria-label="清空学生姓名" hidden>×</button></div>
          </div>
          <div class="field">
            <label for="idInput">身份证号码 / 查询识别码 <span>必填</span></label>
            <div class="input-wrap"><input id="idInput" name="id" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="40" placeholder="请输入完整身份证号码或查询识别码"><button class="field-clear" type="button" data-clear="idInput" aria-label="清空查询识别码" hidden>×</button></div>
          </div>
          <button class="primary-btn" id="queryButton" type="submit">查看成绩报告</button>
          <div class="error" id="errorText" role="alert" aria-live="polite"></div>
          <div class="query-helper"><span>支持学号、查询识别码或身份证号码</span><span>姓名与识别码需完全匹配</span></div>
        </form>
        <p class="query-note" id="queryHint">数据加密存储 · 成绩仅供学生本人及家长查阅 · 请勿在公共设备保存输入内容</p>
      </div>
    </section>

    <section class="report-view" id="reportView" hidden>
      <div class="report-shell" id="reportShell"></div>
    </section>
  </main>

  <script>
    "use strict";
    const STUDENTS = [];
    const CLASS_SUMMARY = {"className":"高二4班","students":48,"average":366.885416666667,"controlCount":1,"bachelorCount":23,"bachelorChange":11};

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#039;");
    const number = (value) => {
      if (value == null) return null;
      if (typeof value === "string" && !value.trim()) return null;
      if (["—", "-", "--", "无", "暂无", "null", "undefined", "/"].includes(String(value).trim().toLowerCase())) return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };
    const fmt = (value, digits = 1) => number(value) == null ? "—" : Number(value).toFixed(digits).replace(/\.0$/, "");
    const signed = (value) => {
      const n = number(value);
      return n == null ? "—" : `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
    };
    const statusFor = (controlDiff, bachelorDiff) => {
      const control = number(controlDiff);
      const bachelor = number(bachelorDiff);
      if (control != null && control >= 0) return { label: "特控线上", cls: "state-control" };
      if (bachelor != null && bachelor >= 0) return { label: "本科线上", cls: "state-bachelor" };
      if (bachelor != null && bachelor >= -10) return { label: "本科临界", cls: "state-close" };
      if (bachelor != null) return { label: "本科线下", cls: "state-below" };
      return { label: "暂无线差", cls: "state-close" };
    };
    const diffClass = (value) => number(value) == null ? "diff-neutral" : number(value) >= 0 ? "diff-positive" : "diff-negative";

    const textEncoder = new TextEncoder();
    const bytesToHex = (bytes) => Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    const base64ToBytes = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));

    let dataBundlePromise = null;
    let activeDataMeta = { ...BUILD_META, schemaVersion: 1, dataVersion: "legacy" };

    async function sha256Hex(value) {
      const digest = await crypto.subtle.digest("SHA-256", textEncoder.encode(value));
      return bytesToHex(new Uint8Array(digest));
    }

    async function fetchJsonWithTimeout(url, timeout = 9000) {
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) return null;
        return await response.json();
      } finally {
        window.clearTimeout(timer);
      }
    }

    function loadDataBundle() {
      if (!dataBundlePromise) {
        dataBundlePromise = fetchJsonWithTimeout(`data/grade-data.v2.json?v=${Date.now()}`).then((bundle) => {
          if (bundle?.kind !== "grade-query-bundle" || bundle.schemaVersion !== 2) return null;
          activeDataMeta = {
            ...activeDataMeta,
            schemaVersion: bundle.schemaVersion,
            dataVersion: bundle.dataVersion || "v2",
            generatedAt: bundle.generatedAt,
            studentCount: bundle.studentCount,
            examCount: bundle.examCount,
            latestExam: bundle.latestExam,
          };
          return bundle;
        }).catch(() => null);
      }
      return dataBundlePromise;
    }

    async function decryptRecord(secret, encrypted) {
      const material = await crypto.subtle.importKey(
        "raw",
        textEncoder.encode(secret),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: base64ToBytes(encrypted.salt), iterations: 240000, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(encrypted.iv) },
        key,
        base64ToBytes(encrypted.data),
      );
      return JSON.parse(new TextDecoder().decode(plaintext));
    }

    async function loadStudent(name, id) {
      const secret = `${name.trim()}|${id.replace(/\s+/g, "").trim().toUpperCase()}`;
      const v2Id = await sha256Hex(`grade-query-v2|${secret}`);
      const bundle = await loadDataBundle();
      if (bundle?.records?.[v2Id]) return decryptRecord(secret, bundle.records[v2Id]);
      const legacyId = await sha256Hex(`grade-query-v1|${secret}`);
      const encrypted = await fetchJsonWithTimeout(`data/${legacyId}.json`);
      if (!encrypted) return null;
      return decryptRecord(secret, encrypted);
    }

    async function handleQuery(event) {
      if (event) event.preventDefault();
      const name = nameInput.value.trim();
      const id = idInput.value.replace(/\s+/g, "").trim().toUpperCase();

        (!name ? nameInput : idInput).focus();
        return;
      }
      if (!window.crypto?.subtle || !window.isSecureContext) {
        errorText.textContent = "请使用微信、Chrome、Edge 或 Safari 通过 HTTPS 打开本页面。";
        return;
      }
      queryButton.disabled = true;
      queryButton.textContent = "正在安全读取…";
      queryButton.setAttribute("aria-busy", "true");
      try {
        const student = await loadStudent(name, id);
        if (!student) {
          errorText.textContent = "姓名或身份证号码不匹配，请重新核对";
          return;
        }
        if (!student.current) {
          errorText.textContent = "该学生暂未匹配到零诊成绩";
          return;
        }
        renderReport(student);
      } catch (error) {
        console.error(error);
        queryView.hidden = false;
        reportView.hidden = true;
        errorText.textContent = error?.name === "AbortError" ? "读取超时，请检查网络后重试。" : "查询失败，请检查网络后重试，或确认姓名和查询识别码。";
      } finally {
        queryButton.disabled = false;
        queryButton.textContent = "查看成绩报告";
        queryButton.removeAttribute("aria-busy");
      }
    }

    function subjectRows(student) {

        const scorePct = item.score == null ? 0 : Math.max(0, Math.min(100, (item.score / subject.max) * 100));
        const controlPct = controlLine == null ? null : Math.max(0, Math.min(100, (controlLine / subject.max) * 100));
        const bachelorPct = bachelorLine == null ? null : Math.max(0, Math.min(100, (bachelorLine / subject.max) * 100));
        return `

    function createInsights(student) {
      const pairs = SUBJECTS.map((subject) => ({ ...subject, ...(student.current.subjects?.[subject.key] || {}) }));
      const strongest = [...pairs].sort((a, b) => (b.controlDiff ?? -999) - (a.controlDiff ?? -999)).slice(0, 2);
      const belowControl = pairs.filter((item) => item.controlDiff < 0).sort((a, b) => Math.abs(a.controlDiff) - Math.abs(b.controlDiff));
      const belowBachelor = pairs.filter((item) => item.bachelorDiff < 0).sort((a, b) => Math.abs(a.bachelorDiff) - Math.abs(b.bachelorDiff));
      const focus = belowControl[0] ?? belowBachelor[0] ?? strongest[0];
      const exams = (student.exams || []).filter((exam) => number(exam.total) != null);
      const latest = exams[exams.length - 1];
      const previous = exams[exams.length - 2];
      const lastCity = [...exams].reverse().find((exam) => exam.scope === "city" && exam.name !== latest?.name);
      const scoreChange = latest && previous ? latest.total - previous.total : null;
      const cityRankChange = latest && lastCity && latest.rank && lastCity.rank ? lastCity.rank - latest.rank : null;
      const cityRankText = cityRankChange == null
        ? ""
        : cityRankChange > 0
          ? `；较上次市级统考前进${cityRankChange}名。`
          : cityRankChange < 0
            ? `；较上次市级统考后移${Math.abs(cityRankChange)}名。`
            : "；与上次市级统考排名持平。";
      const focusText = !focus
        ? "当前报告没有足够的科目线数据生成分析。"
        : focus.controlDiff < 0 && focus.bachelorDiff >= 0
        ? `${focus.name}已达本科有效分，距离特控有效分${Math.abs(focus.controlDiff).toFixed(1)}分。`

          : `${focus.name}目前处于较稳定的上线区间。`;
      return [
        { title: "优势表现", text: `${strongest.map((item) => item.name).join("、")}是本次相对表现更突出的学科。` },
        { title: "关注方向", text: focusText },

      ];
    }

    function bindChartInteractions(student) {
      const canvas = document.getElementById("trendCanvas");
      const tooltip = document.getElementById("chartTooltip");
      if (!canvas || !tooltip) return;
      const showTooltip = (event) => {
        const chartState = canvas.__chartState;
        if (!chartState?.entries?.length || chartState.entries.length < 2) return;
        const rect = canvas.getBoundingClientRect();
        const localX = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
        let nearest = 0;
        let distance = Infinity;
        chartState.xValues.forEach((x, index) => {
          const next = Math.abs(x - localX);
          if (next < distance) { distance = next; nearest = index; }
        });
        const entry = chartState.entries[nearest];
        tooltip.innerHTML = `<b>${escapeHtml(entry.label)}</b><span>${escapeHtml(chartState.subjectName)}：${fmt(entry.value)} 分</span>`;
        tooltip.hidden = false;
        const wrap = canvas.parentElement;
        const tooltipWidth = tooltip.offsetWidth || 130;
        const left = Math.max(8, Math.min(wrap.clientWidth - tooltipWidth - 8, localX + 12));
        tooltip.style.left = `${left}px`;
        tooltip.style.top = "10px";
      };
      const hideTooltip = () => { tooltip.hidden = true; };
      canvas.addEventListener("pointermove", showTooltip);
      canvas.addEventListener("pointerdown", showTooltip);
      canvas.addEventListener("pointerleave", hideTooltip);
      canvas.addEventListener("pointercancel", hideTooltip);
      canvas.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        const chartState = canvas.__chartState;
        if (!chartState?.entries?.length) return;
        const current = Number(canvas.dataset.activePoint || 0);
        const next = Math.max(0, Math.min(chartState.entries.length - 1, current + (event.key === "ArrowRight" ? 1 : -1)));
        canvas.dataset.activePoint = next;
        const rect = canvas.getBoundingClientRect();
        showTooltip({ clientX: rect.left + chartState.xValues[next], clientY: rect.top + 20 });
      });
      canvas.tabIndex = 0;
      canvas.dataset.activePoint = "0";
    }

    function drawTrend(student, key) {
      const canvas = document.getElementById("trendCanvas");
      const empty = document.getElementById("chartEmpty");
      if (!canvas) return;
      const entries = (student.exams || [])
        .map((exam) => ({ label: EXAM_SHORT[exam.name] || exam.name, value: number(exam.scores?.[key]) }))
        .filter((entry) => entry.value != null);
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(320, rect.width || 800);
      const height = Math.max(220, rect.height || 260);
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.clearRect(0, 0, width, height);
      if (entries.length < 2) {
        canvas.__chartState = { entries: [] };
        canvas.style.visibility = "hidden";
        if (empty) empty.hidden = false;
        return;
      }
      canvas.style.visibility = "visible";
      if (empty) empty.hidden = true;

      const values = entries.map((entry) => entry.value);
      const rawMin = Math.min(...values);
      const rawMax = Math.max(...values);
      const range = Math.max(10, rawMax - rawMin);
      const min = Math.max(0, rawMin - range * .22);
      const max = rawMax + range * .22;
      const pad = { left: 42, right: 24, top: 26, bottom: 36 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const x = (index) => pad.left + (plotW * index) / Math.max(1, entries.length - 1);
      const y = (value) => pad.top + ((max - value) / (max - min)) * plotH;
      canvas.__chartState = { entries, xValues: entries.map((entry, index) => x(index)), subjectName: key === "total" ? "总分" : (SUBJECTS.find((subject) => subject.key === key)?.name || key) };

      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(31, 69, 78, .10)";
      ctx.fillStyle = "#879293";
      ctx.font = "10px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "right";
      for (let i = 0; i < 4; i += 1) {
        const py = pad.top + (plotH * i) / 3;
        const label = max - ((max - min) * i) / 3;
        ctx.beginPath();
        ctx.moveTo(pad.left, py);
        ctx.lineTo(width - pad.right, py);
        ctx.stroke();
        ctx.fillText(label.toFixed(0), pad.left - 8, py + 3);
      }

      const gradient = ctx.createLinearGradient(0, pad.top, 0, height - pad.bottom);
      gradient.addColorStop(0, "rgba(47, 113, 104, .22)");
      gradient.addColorStop(1, "rgba(47, 113, 104, 0)");
      ctx.beginPath();
      ctx.moveTo(x(0), height - pad.bottom);
      entries.forEach((entry, index) => ctx.lineTo(x(index), y(entry.value)));
      ctx.lineTo(x(entries.length - 1), height - pad.bottom);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      entries.forEach((entry, index) => {
        if (index === 0) ctx.moveTo(x(index), y(entry.value));
        else ctx.lineTo(x(index), y(entry.value));
      });
      ctx.strokeStyle = "#2f7168";
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

      entries.forEach((entry, index) => {
        const px = x(index);
        const py = y(entry.value);
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#fffefa";
        ctx.fill();
        ctx.strokeStyle = "#2f7168";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "#263f48";
        ctx.font = "600 11px -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(fmt(entry.value), px, Math.max(14, py - 12));
      });
    }
  </script>
